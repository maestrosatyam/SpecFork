[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "specfork"
version = "0.2.0"
description = "Find the meanings hiding in a function spec before your coding agent picks one: many implementations, executed and clustered, turned into evidence-backed questions and locked tests."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Satyam Dwivedi" }]
requires-python = ">=3.11"
keywords = ["specification", "ambiguity", "coding-agents", "llm", "testing", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
mcp = ["mcp>=2.3,<3"]
docs = ["mkdocs-material>=9.5"]
dev = [
  "specfork[server,mcp]",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "ruff==0.17.3",
  "basedpyright==1.40.2",
]

[project.scripts]
specfork = "specfork.cli:main"

[project.urls]
Homepage = "https://github.com/maestrosatyam/SpecFork"
Issues = "https://github.com/maestrosatyam/SpecFork/issues"

[tool.hatch.build.targets.wheel]
packages = ["specfork"]
artifacts = ["specfork/_web/**"]  # git-ignored build output of web/, bundled by `make package`

[tool.hatch.build.targets.sdist]
include = ["specfork", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["web", "docs/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S102", "S307"]
ignore = ["E501", "B008", "UP038", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E731", "BLE"]
"specfork/_harness.py" = ["E402", "S102", "BLE001", "B"]
"evals/*" = ["E402", "BLE001"]

[tool.basedpyright]
include = ["specfork"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
