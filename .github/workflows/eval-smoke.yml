name: Eval smoke

# Offline checks of the benchmark and the eval harness. No secrets, no network inference:
# the harness test uses the scripted fake LLM from tests/fake_llm.py.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --frozen --python 3.12

      - name: Validate benchmark (references, alt references, test inputs)
        run: uv run python evals/benchmark/validate.py

      - name: Eval harness unit test (fake LLM)
        run: uv run pytest -q tests/test_eval_harness.py
