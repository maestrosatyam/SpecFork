name: Benchmark (live models)
# Runs the 32-spec ambiguity benchmark against each configured model profile and publishes the tables as
# workflow artifacts. Needs repository secrets for the providers it uses (e.g. NEBIUS_API_KEY).
on:
  schedule:
    - cron: "23 3 * * 1"   # weekly; switch to nightly once the budget allows
  workflow_dispatch:
    inputs:
      n:
        description: implementations per condition
        default: "12"
permissions:
  contents: read
concurrency:
  group: benchmark
  cancel-in-progress: false
jobs:
  eval:
    if: ${{ github.repository == 'maestrosatyam/SpecFork' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - { fast: lightning, deep: ultra }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra dev --frozen --python 3.12
      - name: Run benchmark
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          SPECFORK_FAST_MODEL: ${{ matrix.profile.fast }}
          SPECFORK_DEEP_MODEL: ${{ matrix.profile.deep }}
        run: uv run python evals/run_eval.py --n "${{ github.event.inputs.n || '12' }}" --repeats 3 --concurrency 4 --out evals/results
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ matrix.profile.fast }}-${{ matrix.profile.deep }}
          path: evals/results/
